# F# Kernel Setup
# F# kernel (.NET Interactive) is installed separately as a .NET tool:
# 1. Install .NET SDK (https://dotnet.microsoft.com/download)
# 2. Install .NET Interactive: dotnet tool install -g Microsoft.dotnet-interactive
# 3. Register F# kernel with Jupyter: dotnet interactive jupyter install
# Verify installation: jupyter kernelspec list
